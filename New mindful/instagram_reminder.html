<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon::before {
            content: "📵";
            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            color: #262626;
            margin-bottom: 20px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #737373;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .message {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .message p {
            margin: 0;
            color: #262626;
            font-weight: 500;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .primary {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .secondary {
            background: transparent;
            color: #737373;
            border: 2px solid #dbdbdb;
        }

        .secondary:hover {
            background: #fafafa;
            border-color: #737373;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"></div>
        <h1>Hey, remember?</h1>
        <div class="message">
            <p>You deactivated Instagram</p>
        </div>
        <p>You made the conscious decision to take a break from Instagram. This is your reminder to stay focused on what matters to you.</p>
        <div class="actions">
            <button class="primary" onclick="closeTab()">Close This Tab</button>
            <button class="secondary" onclick="goHome()">Go to Homepage</button>
        </div>
    </div>

    <script>
        function closeTab() {
            window.close();
            // If window.close() doesn't work (some browsers block it), redirect to about:blank
            setTimeout(() => {
                window.location.href = 'about:blank';
            }, 100);
        }

        function goHome() {
            window.location.href = 'https://www.google.com';
        }

        // Optional: Auto-redirect after a few seconds
        // setTimeout(() => {
        //     goHome();
        // }, 5000);
    </script>
</body>
</html>
